<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 · Synapse Run</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f6fa; display: flex; justify-content: center;
      align-items: center; min-height: 100vh;
    }
    .card {
      background: #fff; border-radius: 12px; padding: 36px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08); width: 360px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { color: #888; font-size: 13px; margin-bottom: 22px; }
    label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
    input {
      width: 100%; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 10px 12px; font-size: 14px; outline: none;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    button {
      width: 100%; margin-top: 22px; background: #4f46e5; color: #fff;
      border: none; border-radius: 8px; padding: 11px; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .msg.err { color: #b91c1c; }
    .msg.ok { color: #15803d; }
    .alt { margin-top: 16px; text-align: center; font-size: 13px; color: #777; }
    .alt a { color: #4f46e5; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>注册</h1>
    <div class="sub">创建你的 Synapse Run 账号</div>
    <form id="regForm">
      <label>用户名</label>
      <input name="username" required maxlength="64" autocomplete="username">
      <label>密码（至少 6 位）</label>
      <input name="password" type="password" required minlength="6"
             autocomplete="new-password">
      <label>确认密码</label>
      <input name="password2" type="password" required autocomplete="new-password">
      <button type="submit">注册</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="alt">已有账号？<a href="/auth/login">去登录</a></div>
  </div>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.className = 'msg'; msg.textContent = '';
      const fd = new FormData(e.target);
      if (fd.get('password') !== fd.get('password2')) {
        msg.className = 'msg err'; msg.textContent = '两次输入的密码不一致';
        return;
      }
      try {
        const r = await fetch('/auth/register', { method: 'POST', body: fd });
        const data = await r.json();
        if (r.ok && data.success) {
          msg.className = 'msg ok'; msg.textContent = '注册成功，正在跳转到登录…';
          setTimeout(() => location.href = '/auth/login', 800);
        } else {
          msg.className = 'msg err'; msg.textContent = data.message || '注册失败';
        }
      } catch { msg.className = 'msg err'; msg.textContent = '网络错误'; }
    });
  </script>
</body>
</html>
